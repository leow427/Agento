[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@^7.4.2

[env:waveshare_amoled]
; pioarduino = Arduino-ESP32 3.3.11, the core version Waveshare builds its 1.75C examples with
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 32MB
; Waveshare CI: FlashMode=qio, USBMode=hwcdc, CDCOnBoot=cdc. The partition table stays inside 16 MB.
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.embed_txtfiles = src/portal.html
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino@1.6.8
    bblanchon/ArduinoJson@^7.4.2
    lewisxhe/SensorLib@0.3.3
    lewisxhe/XPowersLib@0.2.6
